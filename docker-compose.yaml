services:
   app:
       build:
           context: .
       ports:
           - "8000:8000"
       volumes:
           - ./:/src
       command: >
           sh -c "alembic upgrade head && alembic revision --autogenerate && alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
       env_file:
           - .env
       depends_on:
           - db

   db:
       image: postgres:14-alpine
       restart: always
       ports:
           - "5433:5432"
       env_file:
           - .env
       volumes:
           - my_db:$PGDATA

volumes:
    my_db:
